services:

  # ---------------------------------------------------------
  # DATABASE POSTGRES
  # ---------------------------------------------------------
  db:
    image: postgres:16
    container_name: escursioni_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: escursioni
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ---------------------------------------------------------
  # SERVIZIO DI SVILUPPO .NET CON AUTO-RELOAD (dotnet watch)
  # ---------------------------------------------------------
  web-dev:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: escursioni_web_dev
    depends_on:
      db:
        condition: service_healthy

    working_dir: /src/Escursioni.Web

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=escursioni;Username=postgres;Password=postgres"

    # 🔥 Volumi fondamentali:
    # 1) Monti tutta la solution
    # 2) Monti *anche* wwwroot così GPX/KML vengono serviti davvero
    volumes:
      - ./:/src
      - ./Escursioni.Web/wwwroot:/src/Escursioni.Web/wwwroot

    command: ["dotnet", "watch", "run", "--no-launch-profile", "--urls", "http://0.0.0.0:8080"]

    ports:
      - "8080:8080"
