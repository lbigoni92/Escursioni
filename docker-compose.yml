services:

  # ---------------------------------------------------------
  # SITO COME SERVER (opzionale: in produzione il sito è statico,
  # generato con "dotnet run --project Escursioni.Web -- --export ../dist")
  # I dati sono i file JSON in Escursioni.Web/Data/hikes: nessun database.
  # ---------------------------------------------------------
  web-dev:
    build:
      context: .
      dockerfile: Escursioni.Web/Dockerfile
    container_name: escursioni_web_dev

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

    # Media esclusi dal build context (.dockerignore): montati qui.
    # Scrivibile perché ImagePrewarmService genera le varianti .webp nella cartella.
    volumes:
      - ./Escursioni.Web/wwwroot/media:/app/wwwroot/media

    ports:
      - "8080:8080"
