services:

  # ---------------------------------------------------------
  # DATABASE POSTGRES
  # ---------------------------------------------------------
  db:
    image: postgres:16
    container_name: escursioni_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: escursioni
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ---------------------------------------------------------
  # SERVIZIO DI SVILUPPO .NET CON AUTO-RELOAD (dotnet watch)
  # ---------------------------------------------------------
  web-dev:
    build:
      context: .
      dockerfile: Escursioni.Web/Dockerfile
    container_name: escursioni_web_dev
    depends_on:
      db:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=escursioni;Username=postgres;Password=postgres;SslMode=Prefer"
      SMTP_USER: "apikey"
      SMTP_PASS: "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"
      SMTP_FROM: "BigoniEscursioni@outlook.com"

    ports:
      - "8080:8080"
