
services:
  db:
    image: postgres:16
    container_name: escursioni_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: escursioni
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # IMMAGINE "PUBBLICATA" (come prima, opzionale in sviluppo)
  web:
    build:
      context: .
      dockerfile: Escursioni.Web/Dockerfile
    container_name: escursioni_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=escursioni;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    volumes:
      - ./Escursioni.Web/wwwroot:/app/wwwroot:ro

  # SERVIZIO DI SVILUPPO CON AUTO-RELOAD
  web-dev:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: escursioni_web_dev
    depends_on:
      db:
        condition: service_healthy
    working_dir: /src/Escursioni.Web
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=escursioni;Username=postgres;Password=postgres"
    volumes:
      # monta tutta la solution
      - ./:/src
      # (opzionale) cache NuGet per velocizzare restore:
      # - ~/.nuget/packages:/root/.nuget/packages
    command: ["dotnet", "watch", "run", "--no-launch-profile", "--urls", "http://0.0.0.0:8080"]
    ports:
      - "8080:8080"
